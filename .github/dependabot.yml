version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /secureai
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
